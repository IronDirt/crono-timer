<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch &amp; Timer</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.light-theme {
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      color: #1a1a1a;
    }

    body.dark-theme {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f0f0f0;
    }

    .widget-container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px;
    }

    .widget {
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .light-theme .widget {
      background: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .dark-theme .widget {
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .display {
      font-size: 3.5rem;
      font-weight: 700;
      text-align: center;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.1em;
      margin: 30px 0;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .light-theme .display {
      color: #2563eb;
    }

    .dark-theme .display {
      color: #60a5fa;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-primary.playing {
      background: #22c55e;
    }

    .btn-primary.playing:hover {
      background: #16a34a;
    }

    .btn-primary.paused {
      background: #eab308;
    }

    .btn-primary.paused:hover {
      background: #ca8a04;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #1a1a1a;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .dark-theme .btn-secondary {
      background: #374151;
      color: #f0f0f0;
    }

    .dark-theme .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-reset {
      background: #ef4444;
      color: white;
    }

    .btn-reset:hover {
      background: #dc2626;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-fullscreen {
      background: #8b5cf6;
      color: white;
      padding: 10px 16px;
      font-size: 0.85rem;
    }

    .btn-fullscreen:hover {
      background: #7c3aed;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .theme-toggle, .language-toggle {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .light-theme .theme-toggle {
      background: #e5e7eb;
      color: #1a1a1a;
    }

    .light-theme .theme-toggle:hover {
      background: #d1d5db;
    }

    .dark-theme .theme-toggle {
      background: #374151;
      color: #f0f0f0;
    }

    .dark-theme .theme-toggle:hover {
      background: #4b5563;
    }

    .light-theme .language-toggle {
      background: #e5e7eb;
      color: #1a1a1a;
    }

    .light-theme .language-toggle:hover {
      background: #d1d5db;
    }

    .dark-theme .language-toggle {
      background: #374151;
      color: #f0f0f0;
    }

    .dark-theme .language-toggle:hover {
      background: #4b5563;
    }

    .fullscreen-mode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    body.light-theme .fullscreen-mode {
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      color: #1a1a1a;
    }

    body.dark-theme .fullscreen-mode {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f0f0f0;
    }

    .fullscreen-mode .display {
      font-size: 8rem;
      margin: 40px 0;
    }

    .fullscreen-controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .fullscreen-controls .btn {
      padding: 20px 40px;
      font-size: 1.2rem;
    }

    .footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .light-theme .footer {
      color: #666;
    }

    .dark-theme .footer {
      color: #aaa;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .input-group input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
    }

    .dark-theme .input-group input {
      border-color: #374151;
      background: #0f172a;
      color: #f0f0f0;
    }

    .light-theme .input-group input {
      background: #f9fafb;
      color: #1a1a1a;
    }

    .laps-list {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 10px;
    }

    .light-theme .laps-list {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .dark-theme .laps-list {
      background: #0f172a;
      border: 1px solid #374151;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 600;
    }

    .light-theme .lap-item {
      background: white;
      color: #1a1a1a;
      border: 1px solid #e5e7eb;
    }

    .dark-theme .lap-item {
      background: #1e293b;
      color: #f0f0f0;
      border: 1px solid #374151;
    }

    .lap-number {
      color: #8b5cf6;
      font-weight: 700;
      min-width: 50px;
    }

    .lap-time {
      flex: 1;
      text-align: center;
    }

    .clear-laps-btn {
      padding: 8px 12px;
      font-size: 0.75rem;
      background: #ef4444;
      color: white;
    }

    .clear-laps-btn:hover {
      background: #dc2626;
    }

    @media (max-width: 480px) {
      .display {
        font-size: 2.5rem;
        margin: 20px 0;
      }

      .fullscreen-mode .display {
        font-size: 5rem;
      }

      .btn {
        padding: 10px 16px;
        font-size: 0.85rem;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls-top {
        width: 100%;
        justify-content: space-between;
      }
    }

    i[data-lucide] {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="light-theme">
  <div class="widget-container">
   <div class="header">
    <h1 class="title" id="appTitle">Stopwatch &amp; Timer</h1>
    <div class="controls-top">
     <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
   </div><!-- CRONOMETRO -->
   <div class="widget">
    <h2 id="stopwatchTitle" style="text-align: center; margin-bottom: 20px; font-size: 1.3rem;">Cronometro</h2>
    <div class="display" id="stopwatchDisplay">
     00:00:00
    </div>
    <div class="controls">
     <button class="btn btn-primary" id="stopwatchStart"> <i data-lucide="play"></i> <span id="stopwatchStartText">Start</span> </button> <button class="btn btn-secondary" id="stopwatchLap"> <i data-lucide="flag"></i> <span id="stopwatchLapText">Giro</span> </button> <button class="btn btn-reset" id="stopwatchReset"> <i data-lucide="rotate-ccw"></i> <span id="stopwatchResetText">Reset</span> </button> <button class="btn btn-fullscreen" id="stopwatchFullscreen"> <i data-lucide="maximize-2"></i> </button>
    </div>
    <div class="laps-list" id="stopwatchLapsList"></div>
   </div><!-- TIMER -->
   <div class="widget">
    <h2 id="timerTitle" style="text-align: center; margin-bottom: 20px; font-size: 1.3rem;">Timer</h2>
    <div class="input-group" id="timerInputGroup">
     <input type="number" id="timerMinutes" min="0" max="59" placeholder="Minuti" value="1"> <span>:</span> <input type="number" id="timerSeconds" min="0" max="59" placeholder="Secondi" value="0">
    </div>
    <div class="display" id="timerDisplay">
     00:00
    </div>
    <div class="controls">
     <button class="btn btn-primary" id="timerStart"> <i data-lucide="play"></i> <span id="timerStartText">Avvia</span> </button> <button class="btn btn-reset" id="timerReset"> <i data-lucide="rotate-ccw"></i> <span id="timerResetText">Ripristina</span> </button> <button class="btn btn-fullscreen" id="timerFullscreen"> <i data-lucide="maximize-2"></i> </button>
    </div>
   </div><!-- FOOTER -->
   <div class="footer" id="footer">
    © 2024 Stopwatch &amp; Timer. Tutti i diritti riservati.
   </div>
  </div><!-- FULLSCREEN STOPWATCH -->
  <div id="stopwatchFullscreenMode" class="fullscreen-mode" style="display: none;">
   <button class="btn btn-danger" id="exitStopwatchFullscreen" style="position: absolute; top: 20px; right: 20px;"> <i data-lucide="x"></i> <span id="exitText">Esci</span> </button>
   <div class="display" id="stopwatchFullscreenDisplay">
    00:00:00
   </div>
   <div class="fullscreen-controls">
    <button class="btn btn-primary" id="stopwatchFullscreenStart"> <i data-lucide="play"></i> <span id="stopwatchFsStartText">Start</span> </button> <button class="btn btn-secondary" id="stopwatchFullscreenLap"> <i data-lucide="flag"></i> <span id="stopwatchFsLapText">Giro</span> </button> <button class="btn btn-reset" id="stopwatchFullscreenReset"> <i data-lucide="rotate-ccw"></i> <span id="stopwatchFsResetText">Reset</span> </button>
   </div>
   <div class="laps-list" id="stopwatchFullscreenLapsList"></div>
  </div><!-- FULLSCREEN TIMER -->
  <div id="timerFullscreenMode" class="fullscreen-mode" style="display: none;">
   <button class="btn btn-danger" id="exitTimerFullscreen" style="position: absolute; top: 20px; right: 20px;"> <i data-lucide="x"></i> <span id="exitText2">Esci</span> </button>
   <div class="display" id="timerFullscreenDisplay">
    00:00
   </div>
   <div class="fullscreen-controls">
    <button class="btn btn-primary" id="timerFullscreenStart"> <i data-lucide="play"></i> <span id="timerFsStartText">Avvia</span> </button> <button class="btn btn-reset" id="timerFullscreenReset"> <i data-lucide="rotate-ccw"></i> <span id="timerFsResetText">Ripristina</span> </button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      app_title: "Stopwatch & Timer"
    };
    let config = { ...defaultConfig };

    // Traduzioni
    const translations = {
      it: {
        stopwatch: "Cronometro",
        timer: "Timer",
        start: "Start",
        pause: "Pause",
        reset: "Reset",
        exit: "Esci",
        copyright: "© 2024 Stopwatch & Timer. Tutti i diritti riservati.",
        minutes: "Minuti",
        seconds: "Secondi"
      }
    };

    let currentLanguage = "it";
    let currentTheme = "light";

    // State
    let stopwatchRunning = false;
    let timerRunning = false;
    let stopwatchMs = 0;
    let timerMs = 0;
    let stopwatchInterval = null;
    let timerInterval = null;
    let laps = [];
    let lastLapTime = 0;

    // Initialize
    async function initElementSdk() {
      if (window.elementSdk) {
        await window.elementSdk.init({
          defaultConfig,
          onConfigChange: (newConfig) => {
            config = newConfig;
            document.getElementById('appTitle').textContent = config.app_title || defaultConfig.app_title;
          },
          mapToCapabilities: () => ({
            recolorables: [],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: () => new Map([
            ["app_title", config.app_title || defaultConfig.app_title]
          ])
        });
      }
    }

    initElementSdk();
    lucide.createIcons();

    // Theme Toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.classList.remove('light-theme', 'dark-theme');
      document.body.classList.add(`${currentTheme}-theme`);
      document.getElementById('themeToggle').textContent = currentTheme === 'light' ? '🌙' : '☀️';
      lucide.createIcons();
    });

    function updateLanguage() {
      const t = translations[currentLanguage];
      document.getElementById('stopwatchTitle').textContent = t.stopwatch;
      document.getElementById('timerTitle').textContent = t.timer;
      document.getElementById('stopwatchStartText').textContent = stopwatchRunning ? t.pause : t.start;
      document.getElementById('stopwatchResetText').textContent = t.reset;
      document.getElementById('timerStartText').textContent = timerRunning ? t.pause : t.start;
      document.getElementById('timerResetText').textContent = t.reset;
      document.getElementById('footer').textContent = t.copyright;
      document.getElementById('timerMinutes').placeholder = t.minutes;
      document.getElementById('timerSeconds').placeholder = t.seconds;
      
      // Fullscreen texts
      document.getElementById('exitStopwatchFullscreen').innerHTML = `<i data-lucide="x"></i><span>${t.exit}</span>`;
      document.getElementById('exitTimerFullscreen').innerHTML = `<i data-lucide="x"></i><span>${t.exit}</span>`;
      document.getElementById('stopwatchFsStartText').textContent = stopwatchRunning ? t.pause : t.start;
      document.getElementById('stopwatchFsResetText').textContent = t.reset;
      document.getElementById('timerFsStartText').textContent = timerRunning ? t.pause : t.start;
      document.getElementById('timerFsResetText').textContent = t.reset;
      
      lucide.createIcons();
    }

    // STOPWATCH FUNCTIONS
    function formatStopwatch(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateStopwatchDisplay() {
      document.getElementById('stopwatchDisplay').textContent = formatStopwatch(stopwatchMs);
      document.getElementById('stopwatchFullscreenDisplay').textContent = formatStopwatch(stopwatchMs);
    }

    function toggleStopwatch() {
      stopwatchRunning = !stopwatchRunning;
      const t = translations[currentLanguage];
      
      // Update text
      document.getElementById('stopwatchStartText').textContent = stopwatchRunning ? t.pause : t.start;
      document.getElementById('stopwatchFsStartText').textContent = stopwatchRunning ? t.pause : t.start;
      
      // Update button classes and icons
      const stopwatchStartBtn = document.getElementById('stopwatchStart');
      const stopwatchFsStartBtn = document.getElementById('stopwatchFullscreenStart');
      
      if (stopwatchRunning) {
        stopwatchStartBtn.classList.add('playing');
        stopwatchStartBtn.classList.remove('paused');
        stopwatchFsStartBtn.classList.add('playing');
        stopwatchFsStartBtn.classList.remove('paused');
        
        stopwatchStartBtn.innerHTML = '<i data-lucide="pause"></i> <span id="stopwatchStartText">Pause</span>';
        stopwatchFsStartBtn.innerHTML = '<i data-lucide="pause"></i> <span id="stopwatchFsStartText">Pause</span>';
      } else {
        stopwatchStartBtn.classList.add('paused');
        stopwatchStartBtn.classList.remove('playing');
        stopwatchFsStartBtn.classList.add('paused');
        stopwatchFsStartBtn.classList.remove('playing');
        
        stopwatchStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="stopwatchStartText">Start</span>';
        stopwatchFsStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="stopwatchFsStartText">Start</span>';
      }
      
      lucide.createIcons();

      if (stopwatchRunning) {
        const startTime = Date.now() - stopwatchMs;
        stopwatchInterval = setInterval(() => {
          stopwatchMs = Date.now() - startTime;
          updateStopwatchDisplay();
        }, 10);
      } else {
        clearInterval(stopwatchInterval);
      }
    }

    function resetStopwatch() {
      stopwatchRunning = false;
      stopwatchMs = 0;
      laps = [];
      lastLapTime = 0;
      clearInterval(stopwatchInterval);
      const t = translations[currentLanguage];
      
      const stopwatchStartBtn = document.getElementById('stopwatchStart');
      const stopwatchFsStartBtn = document.getElementById('stopwatchFullscreenStart');
      
      stopwatchStartBtn.classList.remove('playing', 'paused');
      stopwatchFsStartBtn.classList.remove('playing', 'paused');
      
      stopwatchStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="stopwatchStartText">Start</span>';
      stopwatchFsStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="stopwatchFsStartText">Start</span>';
      
      lucide.createIcons();
      updateStopwatchDisplay();
      updateLapsList();
    }

    function recordLap() {
      if (!stopwatchRunning) return;
      
      const lapTime = stopwatchMs - lastLapTime;
      laps.push({
        number: laps.length + 1,
        time: lapTime,
        totalTime: stopwatchMs
      });
      lastLapTime = stopwatchMs;
      updateLapsList();
    }

    function updateLapsList() {
      const list = document.getElementById('stopwatchLapsList');
      const fullscreenList = document.getElementById('stopwatchFullscreenLapsList');
      
      list.innerHTML = '';
      fullscreenList.innerHTML = '';
      
      if (laps.length === 0) return;
      
      [...laps].reverse().forEach(lap => {
        const lapEl = document.createElement('div');
        lapEl.className = 'lap-item';
        lapEl.innerHTML = `
          <span class="lap-number">Giro ${lap.number}</span>
          <span class="lap-time">${formatStopwatch(lap.time)}</span>
        `;
        list.appendChild(lapEl);
        fullscreenList.appendChild(lapEl.cloneNode(true));
      });
    }

    // TIMER FUNCTIONS
    function formatTimer(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      document.getElementById('timerDisplay').textContent = formatTimer(timerMs);
      document.getElementById('timerFullscreenDisplay').textContent = formatTimer(timerMs);
    }

    function toggleTimer() {
      if (!timerRunning) {
        const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
        const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
        const totalMs = (minutes * 60 + seconds) * 1000;

        if (totalMs <= 0) return;

        timerMs = totalMs;
        timerRunning = true;
        document.getElementById('timerInputGroup').style.display = 'none';
      } else {
        timerRunning = false;
        clearInterval(timerInterval);
        document.getElementById('timerInputGroup').style.display = 'flex';
      }

      const t = translations[currentLanguage];
      const timerStartBtn = document.getElementById('timerStart');
      const timerFsStartBtn = document.getElementById('timerFullscreenStart');
      
      if (timerRunning) {
        timerStartBtn.classList.add('playing');
        timerStartBtn.classList.remove('paused');
        timerFsStartBtn.classList.add('playing');
        timerFsStartBtn.classList.remove('paused');
        
        timerStartBtn.innerHTML = '<i data-lucide="pause"></i> <span id="timerStartText">Pause</span>';
        timerFsStartBtn.innerHTML = '<i data-lucide="pause"></i> <span id="timerFsStartText">Pause</span>';
      } else {
        timerStartBtn.classList.add('paused');
        timerStartBtn.classList.remove('playing');
        timerFsStartBtn.classList.add('paused');
        timerFsStartBtn.classList.remove('playing');
        
        timerStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerStartText">Start</span>';
        timerFsStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerFsStartText">Start</span>';
      }
      
      lucide.createIcons();

      if (timerRunning) {
        const startTime = Date.now();
        timerInterval = setInterval(() => {
          timerMs -= Date.now() - startTime;
          if (timerMs <= 0) {
            timerMs = 0;
            timerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timerInputGroup').style.display = 'flex';
            
            timerStartBtn.classList.remove('playing', 'paused');
            timerFsStartBtn.classList.remove('playing', 'paused');
            
            timerStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerStartText">Start</span>';
            timerFsStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerFsStartText">Start</span>';
            
            lucide.createIcons();
          }
          updateTimerDisplay();
          startTime = Date.now();
        }, 10);
      }
    }

    function resetTimer() {
      timerRunning = false;
      timerMs = 0;
      clearInterval(timerInterval);
      document.getElementById('timerInputGroup').style.display = 'flex';
      
      const timerStartBtn = document.getElementById('timerStart');
      const timerFsStartBtn = document.getElementById('timerFullscreenStart');
      
      timerStartBtn.classList.remove('playing', 'paused');
      timerFsStartBtn.classList.remove('playing', 'paused');
      
      timerStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerStartText">Start</span>';
      timerFsStartBtn.innerHTML = '<i data-lucide="play"></i> <span id="timerFsStartText">Start</span>';
      
      lucide.createIcons();
      updateTimerDisplay();
    }

    // EVENT LISTENERS - STOPWATCH
    document.getElementById('stopwatchStart').addEventListener('click', toggleStopwatch);
    document.getElementById('stopwatchLap').addEventListener('click', recordLap);
    document.getElementById('stopwatchReset').addEventListener('click', resetStopwatch);
    document.getElementById('stopwatchFullscreenStart').addEventListener('click', toggleStopwatch);
    document.getElementById('stopwatchFullscreenLap').addEventListener('click', recordLap);
    document.getElementById('stopwatchFullscreenReset').addEventListener('click', resetStopwatch);
